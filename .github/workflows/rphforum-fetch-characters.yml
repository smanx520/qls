name: RPHForum Fetch Characters

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-rphforum-fetch]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点运行

permissions:
  contents: write
  actions: write

jobs:
  fetch-characters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd rphforum
          npm install

      - name: Run fetch characters script
        id: fetch
        timeout-minutes: 120
        env:
          RPH_HF_ENABLED: ${{ vars.RPH_HF_ENABLED || 'true' }}
          RPH_HF_REPO: ${{ vars.RPH_HF_REPO || 'dasodefa/role-play-data' }}
          RPH_HF_TOKEN: ${{ secrets.RPH_HF_TOKEN }}
          RPH_HF_PROXY_URL: ${{ vars.RPH_HF_PROXY_URL || '' }}
          RPH_HF_BATCH_SIZE: ${{ vars.RPH_HF_BATCH_SIZE || '4' }}
          RPH_CHARACTER_COUNT: ${{ vars.RPH_CHARACTER_COUNT || '10' }}
        run: |
          if [ -z "$RPH_HF_TOKEN" ]; then
            echo "::error::环境变量 RPH_HF_TOKEN 未设置，请在仓库 Secrets 中配置"
            exit 1
          fi

          echo "处理 $RPH_CHARACTER_COUNT 个角色"
          
          cd rphforum
          node fetch-characters.js
